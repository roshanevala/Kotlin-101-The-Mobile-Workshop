name: Kotlin labs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapter-01:
    name: Chapter 01 reference checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            kotlin-labs/**/*.gradle.kts
            kotlin-labs/gradle/wrapper/gradle-wrapper.properties
      - name: Verify a fresh working copy retains the exercise
        working-directory: kotlin-labs
        run: |
          starter_output=$(./gradlew --no-daemon --quiet :ch01-values-and-types:run)
          test "$starter_output" = "1 h 0 min"
          git check-ignore --quiet ch01-values-and-types/src/main/kotlin/workshop/ch01/Timer.kt
      - name: Run and check the separate reference
        working-directory: kotlin-labs
        run: ./gradlew --no-daemon --console=plain :ch01-values-and-types:runSolution :ch01-values-and-types:checkSolution
