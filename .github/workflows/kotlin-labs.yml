name: Kotlin labs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapters:
    name: Chapter ${{ matrix.chapter }} exercise and reference checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - chapter: '01'
            module: ch01-values-and-types
            working_file: ch01-values-and-types/src/main/kotlin/workshop/ch01/Timer.kt
            starter_output: '1 h 0 min'
          - chapter: '02'
            module: ch02-control-flow-and-functions
            working_file: ch02-control-flow-and-functions/src/main/kotlin/workshop/ch02/StudyPlan.kt
            starter_output: 'Round 1: Focus'
          - chapter: '03'
            module: ch03-null-safety-and-errors
            working_file: ch03-null-safety-and-errors/src/main/kotlin/workshop/ch03/SessionInput.kt
            starter_output: 'Study Kotlin for 30 min'
          - chapter: '04'
            module: ch04-classes-and-modeling
            working_file: ch04-classes-and-modeling/src/main/kotlin/workshop/ch04/SessionModels.kt
            starter_output: 'Planned: Kotlin for 30 min'
          - chapter: '05'
            module: ch05-collections-and-complexity
            working_file: ch05-collections-and-complexity/src/main/kotlin/workshop/ch05/SessionCollections.kt
            starter_output: 'Completed topics: []'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            kotlin-labs/**/*.gradle.kts
            kotlin-labs/gradle/wrapper/gradle-wrapper.properties
      - name: Verify a fresh working copy retains the exercise
        working-directory: kotlin-labs
        run: |
          starter_output=$(./gradlew --no-daemon --quiet ":${{ matrix.module }}:run")
          test "$starter_output" = "${{ matrix.starter_output }}"
          git check-ignore --quiet "${{ matrix.working_file }}"
      - name: Run and check the separate reference
        working-directory: kotlin-labs
        run: ./gradlew --no-daemon --console=plain ":${{ matrix.module }}:runSolution" ":${{ matrix.module }}:checkSolution"
